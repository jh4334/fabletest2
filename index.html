<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14101c">
<title>방과 후: 그림자 학교</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0d0a12; color: #f7e0bd;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none;
  }
  #stage {
    position: relative; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  /* 720x528 캔버스를 화면에 맞춰 통째로 축소한다(픽셀 뭉개짐 방지). */
  #game {
    width: min(100vw, calc(100vh * 720 / 528));
    height: auto; max-height: 100vh;
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #14101c; display: block;
  }
  #touch { position: absolute; inset: 0; pointer-events: none; }
  #stick, #btnA, #btnB {
    position: absolute; pointer-events: auto; touch-action: none;
    border: 3px solid rgba(247,224,189,0.55); background: rgba(24,18,32,0.34);
  }
  #stick { left: 4vw; bottom: 5vh; width: 108px; height: 108px; border-radius: 50%; }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px;
    border-radius: 50%; background: rgba(247,224,189,0.62);
  }
  #btnA, #btnB {
    right: 5vw; width: 78px; height: 78px; border-radius: 50%;
    color: #f7e0bd; font: 700 22px inherit;
  }
  #btnA { bottom: 12vh; }
  #btnB { bottom: 2vh; right: 20vw; width: 62px; height: 62px; font-size: 18px; }
  /* 마우스·키보드 환경에서는 터치 버튼을 숨긴다. */
  @media (hover: hover) and (pointer: fine) { #touch { display: none; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="720" height="528" aria-label="게임 화면"></canvas>
  <div id="touch">
    <div id="stick"><div id="knob"></div></div>
    <button id="btnA" type="button">A</button>
    <button id="btnB" type="button">B</button>
  </div>
</div>
<script src="src/art.js"></script>
<script src="src/data.js"></script>
<script src="src/engine.js"></script>
<script>window.addEventListener('load', function () { window.GAME.start(); });</script>
</body>
</html>
