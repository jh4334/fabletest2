<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="화면 속으로 떨어진 아이의 미스터리 어드벤처. 굳어 버린 아이들의 마음을 열어 주며, 잊혀진 이야기와 만나는 여정.">
<meta property="og:type" content="website">
<meta property="og:title" content="마음의 문">
<meta property="og:description" content="화면 속에서, 누군가 기다리고 있다 — 굳어 버린 아이들의 마음을 여는 미스터리 어드벤처.">
<meta property="og:image" content="icons/icon-512.png">
<meta name="twitter:card" content="summary">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="마음의 문">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>마음의 문</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000000;
    overflow: hidden;
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #wrap {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    max-width: 100%;
    max-height: 100%;
    outline: none;
  }

  /* ---- 터치 컨트롤 (모바일/태블릿) ---- */
  #touch-ui { display: none; }
  body.touch #touch-ui { display: block; }
  .tbtn {
    position: fixed;
    --b: clamp(56px, 13vmin, 82px);
    width: var(--b); height: var(--b);
    background: rgba(28,30,46,.55);
    border: 2px solid rgba(255,255,255,.5);
    border-radius: 16px;
    color: #fff;
    font-size: clamp(22px, 5.4vmin, 30px);
    font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
    z-index: 10;
    backdrop-filter: blur(2px);
    box-shadow: 0 2px 8px rgba(0,0,0,.45);
    transition: transform .04s ease, background .04s ease;
  }
  .tbtn:active { background: rgba(255,255,255,.42); color: #1c1e2e; transform: scale(.92); }
  /* 버튼 아래 작은 안내 글자 */
  .tbtn .sub {
    position: absolute; bottom: -16px; left: 0; right: 0;
    text-align: center; font-size: 11px; font-weight: normal;
    color: rgba(255,255,255,.66); text-shadow: 0 1px 2px #000;
  }

  /* 가상 스틱 — 왼쪽 아래. 손가락으로 끌어 이동(상하좌우). */
  #t-stick {
    position: fixed;
    left: calc(20px + env(safe-area-inset-left));
    bottom: calc(24px + env(safe-area-inset-bottom));
    --sr: clamp(116px, 30vmin, 168px);
    width: var(--sr); height: var(--sr);
    border-radius: 50%;
    background: rgba(28,30,46,.42);
    border: 2px solid rgba(255,255,255,.38);
    box-shadow: inset 0 0 18px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.4);
    backdrop-filter: blur(2px);
    touch-action: none;
    z-index: 10;
  }
  /* 방향 힌트(십자 가이드) */
  #t-stick::before, #t-stick::after {
    content: ''; position: absolute; background: rgba(255,255,255,.16);
  }
  #t-stick::before { left: 18%; right: 18%; top: 50%; height: 2px; margin-top: -1px; }
  #t-stick::after  { top: 18%; bottom: 18%; left: 50%; width: 2px; margin-left: -1px; }
  #t-stick-knob {
    position: absolute; left: 50%; top: 50%;
    width: 46%; height: 46%;
    border-radius: 50%;
    background: rgba(255,255,255,.5);
    border: 2px solid rgba(255,255,255,.75);
    box-shadow: 0 2px 8px rgba(0,0,0,.45);
    transform: translate(-50%, -50%);
    transition: transform .03s linear;
    pointer-events: none;
  }

  /* A(결정/피하기) — 오른쪽 아래, 크고 둥글게 */
  #t-a {
    right: calc(26px + env(safe-area-inset-right));
    bottom: calc(44px + var(--b) * 0.4 + env(safe-area-inset-bottom));
    --b: clamp(72px, 17vmin, 104px);
    border-radius: 50%;
    background: rgba(224,90,90,.42);
    border-color: rgba(255,170,170,.7);
  }
  /* 친구 수첩(C) — 오른쪽 위 작은 버튼 */
  #t-menu {
    right: calc(16px + env(safe-area-inset-right));
    top: calc(16px + env(safe-area-inset-top));
    --b: clamp(46px, 9.5vmin, 58px);
    font-size: clamp(13px, 3vmin, 16px);
    border-radius: 12px;
  }
  /* 메뉴·뒤로(X) — 왼쪽 위 작은 버튼 */
  #t-pause {
    left: calc(16px + env(safe-area-inset-left));
    top: calc(16px + env(safe-area-inset-top));
    --b: clamp(46px, 9.5vmin, 58px);
    font-size: clamp(13px, 3vmin, 16px);
    border-radius: 12px;
  }
  /* 힌트(H) — 방탈출 중에만 표시, A 버튼 위쪽 */
  #t-hint { display: none; }
  body.battle-hint #t-hint {
    display: flex;
    right: calc(26px + env(safe-area-inset-right));
    bottom: calc(168px + var(--b) * 0.4 + env(safe-area-inset-bottom));
    --b: clamp(50px, 11.5vmin, 68px);
    font-size: clamp(12px, 2.6vmin, 15px);
    border-radius: 12px;
    background: rgba(255,214,68,.3);
    border-color: rgba(255,214,68,.7);
    color: #2a2410;
  }

  /* 선생님(교사 전용 방) — 타이틀의 슬롯 화면에서만, 오른쪽 아래에 작고 눈에 띄지 않게 */
  #t-teacher { display: none; }
  body.title-slots #t-teacher {
    display: flex;
    right: calc(14px + env(safe-area-inset-right));
    bottom: calc(14px + env(safe-area-inset-bottom));
    --b: clamp(34px, 7vmin, 42px);
    font-size: clamp(10px, 2.2vmin, 12px);
    border-radius: 10px;
    background: rgba(28,30,46,.4);
    opacity: .7;
  }

  /* ---- 세로 모드일 때 가로로 돌리라는 안내 ---- */
  #rotate-hint {
    display: none;
    position: fixed; inset: 0;
    background: #000000;
    color: #fff;
    flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px; text-align: center;
    z-index: 100;
    font-size: 20px;
  }
  #rotate-hint .ico { font-size: 64px; animation: rot 1.8s ease-in-out infinite; }
  #rotate-hint small { color: #888; font-size: 15px; line-height: 1.5; }
  @keyframes rot { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(78deg); } }
  @media (orientation: portrait) and (pointer: coarse) {
    #rotate-hint { display: flex; }
  }

  /* ---- 이름 입력 오버레이 ---- */
  #name-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.78);
    align-items: center; justify-content: center;
    z-index: 50;
  }
  #name-overlay .np-card {
    background: #000;
    border: 3px solid #fff;
    border-radius: 8px;
    padding: 28px 32px;
    text-align: center;
    width: min(86vw, 360px);
  }
  #name-overlay .np-title { color: #fff; font-size: 19px; font-weight: bold; margin-bottom: 6px; }
  #name-overlay .np-sub { color: #888; font-size: 13px; margin-bottom: 16px; }
  #name-input {
    width: 100%;
    font-size: 22px; text-align: center;
    padding: 10px 12px;
    border: 2px solid #444; border-radius: 6px;
    background: #000; color: #fff;
    outline: none;
  }
  #name-input:focus { border-color: #e0453a; }
  #name-overlay .np-hint { color: #777; font-size: 13px; margin-top: 14px; }
  #name-overlay .np-go {
    margin-top: 16px;
    background: #fff; color: #000;
    font-size: 16px; font-weight: bold;
    border: none; border-radius: 6px;
    padding: 12px 28px; cursor: pointer;
  }

  /* ---- 초기 로딩 표시 (스크립트 파싱·초기화 동안) — __game 준비되면 JS가 숨긴다 ---- */
  #loading {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #12101c; color: #fff; gap: 10px;
  }
  #loading .load-title { font-size: 26px; font-weight: bold; letter-spacing: 2px; }
  #loading .load-sub {
    font-size: 14px; color: #9a93b0;
    animation: loadpulse 1.4s ease-in-out infinite;
  }
  @keyframes loadpulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #loading .load-sub { animation: none; } }

  /* ---- 첫 로딩 실패 안내 (스크립트가 안 받아졌을 때) ---- */
  #boot-error {
    display: none;
    position: fixed; inset: 0;
    background: #000; color: #fff;
    flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; text-align: center; padding: 24px;
    z-index: 200; font-size: 18px;
  }
  #boot-error small { color: #999; font-size: 14px; line-height: 1.6; }
  #boot-error button {
    background: #fff; color: #000;
    font-size: 16px; font-weight: bold;
    border: none; border-radius: 6px;
    padding: 12px 28px; cursor: pointer; margin-top: 6px;
  }
</style>
</head>
<body>
<noscript>
  <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#12101c;color:#fff;font-family:sans-serif;text-align:center;padding:24px;z-index:9999;">
    <div>
      <div style="font-size:20px;font-weight:bold;margin-bottom:12px;">자바스크립트가 꺼져 있어요</div>
      <div style="color:#cfc8e0;font-size:15px;line-height:1.7;">「마음의 문」은 브라우저에서 자바스크립트로 동작해요.<br>브라우저 설정에서 자바스크립트를 켠 뒤 새로고침해 주세요.</div>
    </div>
  </div>
</noscript>
<div id="loading">
  <div class="load-title">마음의 문</div>
  <div class="load-sub">불러오는 중…</div>
</div>
<div id="wrap">
  <canvas id="game" width="720" height="528" tabindex="0" role="application" aria-label="마음의 문 게임 화면. 방향키로 이동, Z 또는 스페이스로 결정합니다."></canvas>
</div>
<div id="touch-ui">
  <div id="t-stick" role="application" aria-label="이동 스틱. 손가락으로 끌어 상하좌우로 움직입니다.">
    <div id="t-stick-knob"></div>
  </div>
  <div class="tbtn" id="t-a" role="button" aria-label="결정·대화">A<span class="sub">결정</span></div>
  <div class="tbtn" id="t-hint" role="button" aria-label="힌트 보기">힌트</div>
  <div class="tbtn" id="t-menu" role="button" aria-label="친구 수첩 열기">수첩</div>
  <div class="tbtn" id="t-pause" role="button" aria-label="메뉴 열기">메뉴</div>
  <div class="tbtn" id="t-teacher" role="button" aria-label="선생님 방 열기">선생님</div>
</div>
<div id="rotate-hint">
  <div class="ico">📱</div>
  <div>화면을 가로로 돌려 주세요</div>
  <small>마음의 문은 가로 화면에 맞춰져 있어요</small>
</div>
<div id="name-overlay">
  <div class="np-card">
    <div class="np-title">수호자의 이름은?</div>
    <div class="np-sub">최대 6글자 · 비워 두면 "수호자"</div>
    <input id="name-input" maxlength="6" placeholder="수호자" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="수호자 이름 입력 (최대 6글자, 비우면 수호자)">
    <div><button class="np-go" id="name-go">모험 시작 ▶</button></div>
    <div class="np-hint">Enter 또는 A 버튼으로 시작 · Esc로 취소</div>
  </div>
</div>
<div id="boot-error">
  <div>게임을 불러오지 못했어요 😢</div>
  <small>인터넷 연결을 확인한 뒤 다시 시도해 주세요.<br>처음 한 번만 연결되면, 이후에는 오프라인에서도 실행됩니다.</small>
  <button onclick="location.reload()">다시 시도</button>
</div>
<script src="src/sprites.js"></script>
<script src="src/audio.js"></script>
<script src="src/data.js"></script>
<script src="src/game.js"></script>
<script>
  // 첫 로딩 감시: 게임이 일정 시간 안에 시작되지 않으면(스크립트 누락·네트워크 실패)
  // 검은 화면 대신 안내와 '다시 시도' 버튼을 보여 준다.
  (function () {
    var t = setTimeout(function () {
      if (!window.__game) {
        var el = document.getElementById('boot-error');
        if (el) el.style.display = 'flex';
      }
    }, 6000);
    window.addEventListener('error', function () {
      if (!window.__game) {
        var el = document.getElementById('boot-error');
        if (el) el.style.display = 'flex';
      }
    });
    // 정상 시작되면 감시 해제 + 로딩 표시 제거
    var iv = setInterval(function () {
      if (window.__game) {
        clearTimeout(t); clearInterval(iv);
        var ld = document.getElementById('loading');
        if (ld && ld.parentNode) ld.parentNode.removeChild(ld);
      }
    }, 100);
  })();

  // 오프라인 설치(PWA) — file:// 로 직접 열었을 때는 등록하지 않는다
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
