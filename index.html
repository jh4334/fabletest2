<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14101c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>방과 후: 그림자 학교</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0d0a12; color: #f7e0bd;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none;
  }
  #stage {
    position: relative; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  /* 720x528 캔버스를 화면에 맞춰 통째로 축소한다(픽셀 뭉개짐 방지). */
  #game {
    width: min(100vw, calc(100vh * 720 / 528));
    height: auto; max-height: 100vh;
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #14101c; display: block;
  }
  #touch { position: absolute; inset: 0; pointer-events: none; }
  #stick, #btnA, #btnB {
    position: absolute; pointer-events: auto; touch-action: none;
    border: 3px solid rgba(247,224,189,0.55); background: rgba(24,18,32,0.34);
  }
  #stick {
    left: calc(4vw + env(safe-area-inset-left, 0px));
    bottom: calc(5vh + env(safe-area-inset-bottom, 0px));
    width: 108px; height: 108px; border-radius: 50%;
  }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px;
    border-radius: 50%; background: rgba(247,224,189,0.62);
  }
  #btnA, #btnB {
    right: calc(5vw + env(safe-area-inset-right, 0px));
    width: 82px; height: 82px; border-radius: 50%;
    color: #f7e0bd; font: 700 19px inherit;
  }
  #btnA { bottom: calc(12vh + env(safe-area-inset-bottom, 0px)); }
  #btnB {
    bottom: calc(2vh + env(safe-area-inset-bottom, 0px));
    right: calc(20vw + env(safe-area-inset-right, 0px));
    width: 64px; height: 64px; font-size: 15px;
  }
  /* 마우스·키보드 환경에서는 터치 버튼을 숨긴다. */
  @media (hover: hover) and (pointer: fine) { #touch { display: none; } }
  /* 세로로 들면 게임이 반 토막 — 터치 기기에서만 회전 안내를 띄운다 */
  #rotate {
    display: none; position: absolute; inset: 0; z-index: 8;
    align-items: center; justify-content: center; text-align: center;
    background: #14101c; color: #f7e0bd; font-size: 22px; line-height: 1.9;
  }
  @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
    #rotate { display: flex; }
  }
  /* 스크립트·캔버스 실패 시 아이가 스스로 복구할 수 있는 한 줄 안내 */
  #fallback {
    display: none; position: absolute; inset: 0; z-index: 9;
    align-items: center; justify-content: center; text-align: center;
    background: #14101c; color: #f7e0bd; font-size: 22px; line-height: 1.8;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="720" height="528" aria-label="게임 화면"></canvas>
  <div id="fallback" role="alert">문제가 생겼어요.<br>새로고침(F5)을 한 번 눌러 주세요.</div>
  <div id="rotate" aria-hidden="true">📱 ➜ 🖥️<br>기기를 가로로 돌려 주세요</div>
  <div id="touch">
    <div id="stick"><div id="knob"></div></div>
    <button id="btnA" type="button">확인</button>
    <button id="btnB" type="button">취소</button>
  </div>
</div>
<script src="src/art.js"></script>
<script src="src/sound.js"></script>
<script src="src/data.js"></script>
<script src="src/engine.js"></script>
<script>
// 스크립트가 하나라도 못 떠서 시작이 불가능하면 검은 화면 대신 안내를 띄운다.
window.addEventListener('load', function () {
  // 오프라인 캐시 — file:// 실행은 SW가 불가하니 조용히 건너뛴다
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
    navigator.serviceWorker.register('./sw.js').catch(function () { /* 등록 실패 무해 */ });
  }
  if (window.GAME && window.ART && window.DATA) { window.GAME.start(); return; }
  var fb = document.getElementById('fallback');
  if (fb) fb.style.display = 'flex';
});
window.addEventListener('error', function (e) {
  // 문의 대응용 오류 링버퍼(최근 5건) — 교사가 개발자도구에서 확인할 수 있다.
  try {
    var K = 'shadow-school-errlog';
    var log = JSON.parse(localStorage.getItem(K) || '[]');
    log.push({
      v: (window.GAME && window.GAME.VERSION) || '?',
      at: new Date().toISOString(),
      msg: String(e.message || e.error || 'unknown').slice(0, 200)
    });
    localStorage.setItem(K, JSON.stringify(log.slice(-5)));
  } catch (err) { /* 로깅 실패는 무해 */ }
  // 시작 전에 터진 치명 오류만 안내로 승격(게임 도중 사소한 오류로 화면을 덮지 않게)
  if (window.GAME && window.GAME.state && window.GAME.state()) return;
  var fb = document.getElementById('fallback');
  if (fb) fb.style.display = 'flex';
});
</script>
</body>
</html>
