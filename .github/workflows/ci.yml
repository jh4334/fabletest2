name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 데이터 검증
        run: npm run validate
      - name: 로직 스모크/슬롯 테스트
        run: npm test
      - name: 플레이봇 완주 (프롤로그→진엔딩 회귀)
        run: npm run playtest
      - name: Chromium 설치 (브라우저 스모크용)
        run: npx playwright install --with-deps chromium
      - name: 브라우저 스모크 (desktop/mobile 세로·가로 + 콘솔 에러)
        run: npm run test:browser
      - name: 실패 시 스크린샷 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: shots/browser-*.png
          if-no-files-found: ignore
